    <script>
      // Browser Extension / Interceptor Compatibility Shim
      // In some browser sandbox/iframe environments, window.fetch is exposed with a getter-only descriptor.
      // Extensions like request interceptors attempt `window.fetch = ...`, throwing a TypeError.
      // Providing a configurable getter/setter prevents this crash.
      try {
        let _currentFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _currentFetch;
          },
          set(val) {
            _currentFetch = val;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Ignore if restricted by browser security policies
      }
    </script>
